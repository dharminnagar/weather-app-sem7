name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, format, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The husky `prepare` script is a no-op outside a developer checkout.
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: ESLint (includes Prettier rules)
        run: bun run lint

      - name: Prettier
        run: bun run format:check

      - name: TypeScript
        run: bun run typecheck

      - name: Unit tests
        run: bun test

      - name: Build
        run: bun run build
